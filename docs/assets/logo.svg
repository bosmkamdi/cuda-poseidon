<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c4dff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#651fff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffc107;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff9800;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#grad1)" />
  <!-- Inner hexagon (Poseidon trident stylized) -->
  <g transform="translate(64,64)" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Trident / Psi shape -->
    <line x1="0" y1="-35" x2="0" y2="15" stroke="url(#grad2)" stroke-width="5"/>
    <line x1="-22" y1="-15" x2="-22" y2="20" stroke="white" stroke-width="4"/>
    <line x1="22" y1="-15" x2="22" y2="20" stroke="white" stroke-width="4"/>
    <!-- Top bar -->
    <line x1="-22" y1="-15" x2="22" y2="-15" stroke="url(#grad2)" stroke-width="4"/>
    <!-- GPU chip squares -->
    <rect x="-12" y="18" width="8" height="8" fill="white" rx="1"/>
    <rect x="4" y="18" width="8" height="8" fill="white" rx="1"/>
    <rect x="-4" y="28" width="8" height="8" fill="white" rx="1"/>
  </g>
</svg>
