site_name: cuda-poseidon
site_url: https://bosmkamdi.github.io/cuda-poseidon/
site_author: bosmkamdi
site_description: >-
  High-performance GPU-accelerated Poseidon hash for zero-knowledge proofs,
  Merkle trees, and blockchain applications. Built with CUDA C++.

repo_name: bosmkamdi/cuda-poseidon
repo_url: https://github.com/bosmkamdi/cuda-poseidon
edit_uri: edit/main/docs/

copyright: >-
  Copyright &copy; 2026 bosmkamdi — MIT License

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/logo.svg
  favicon: assets/favicon.png
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.action.view

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true
      type: date
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true

extra_css:
  - assets/extra.css

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  analytics:
    provider: google
    property: G-XXXXXXXXXX
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/bosmkamdi/cuda-poseidon
    - icon: fontawesome/solid/globe
      link: https://bosmkamdi.github.io/cuda-poseidon/

nav:
  - Home:
      - Overview: index.md
      - Quick Start: quickstart.md
      - Changelog: changelog.md
  - User Guide:
      - Installation: guide/installation.md
      - Building: guide/building.md
      - Benchmarks: guide/benchmarks.md
      - Docker: guide/docker.md
  - API Reference:
      - C/C++ API: api/c-api.md
      - Python API: api/python-api.md
      - GPU Backends: api/gpu-backends.md
  - Advanced:
      - Multi-Curve Support: advanced/multi-curve.md
      - Performance Tuning: advanced/performance.md
      - Architecture: advanced/architecture.md
  - Contributing:
      - How to Contribute: contributing.md
      - Code of Conduct: code-of-conduct.md
      - Security: security.md
