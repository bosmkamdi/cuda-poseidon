name: Benchmark

on:
  push:
    branches: [main, master]
    paths:
      - 'poseidon_cuda.cu'
      - 'poseidon_cuda.h'
      - 'poseidon_fields.h'
      - 'bench/**'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  benchmark-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run CPU reference benchmark
        run: python3 scripts/ci_bench_cpu.py
