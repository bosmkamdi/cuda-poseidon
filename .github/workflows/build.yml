name: Build & Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate project structure
        run: |
          test -f poseidon_cuda.cu && echo "poseidon_cuda.cu: OK"
          test -f poseidon_cuda.h && echo "poseidon_cuda.h: OK"
          test -f poseidon_fields.h && echo "poseidon_fields.h: OK"
          test -f poseidon_py.py && echo "poseidon_py.py: OK"
          test -f test_poseidon.c && echo "test_poseidon.c: OK"
          test -f Dockerfile && echo "Dockerfile: OK"
          test -f bench/bench.py && echo "bench/bench.py: OK"
          test -f mkdocs.yml && echo "mkdocs.yml: OK"

      - name: Python syntax check
        run: |
          python3 -c "import py_compile; py_compile.compile('poseidon_py.py', doraise=True)"
          python3 -c "import py_compile; py_compile.compile('bench/bench.py', doraise=True)"
          echo "Python syntax: OK"

      - name: CPU reference benchmark
        run: python3 scripts/ci_bench_cpu.py

      - name: Check CUDA availability
        run: |
          if command -v nvcc &> /dev/null; then
            echo "CUDA found: $(nvcc --version | grep release)"
            nvcc -O3 --shared -o libposeidon_cuda.so poseidon_cuda.cu -Xcompiler -fPIC
            echo "CUDA build: OK"
          else
            echo "CUDA not available, skipping GPU build"
          fi

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify project files
        shell: pwsh
        run: |
          if (Test-Path poseidon_cuda.cu) { Write-Output "poseidon_cuda.cu: OK" }
          if (Test-Path poseidon_cuda.h) { Write-Output "poseidon_cuda.h: OK" }
          if (Test-Path poseidon_py.py) { Write-Output "poseidon_py.py: OK" }

      - name: Check CUDA availability
        shell: pwsh
        run: |
          $nvcc = Get-Command nvcc -ErrorAction SilentlyContinue
          if ($nvcc) {
              Write-Output "CUDA found: $($nvcc.Source)"
              nvcc -O3 -shared -o poseidon_cuda.dll poseidon_cuda.cu
              Write-Output "CUDA build: OK"
          } else {
              Write-Output "CUDA not available, skipping"
          }

  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check file structure
        run: |
          test -f poseidon_cuda.cu && echo "poseidon_cuda.cu: OK"
          test -f poseidon_cuda.h && echo "poseidon_cuda.h: OK"
          test -f poseidon_fields.h && echo "poseidon_fields.h: OK"
          test -f poseidon_py.py && echo "poseidon_py.py: OK"
          test -f test_poseidon.c && echo "test_poseidon.c: OK"
          test -f Dockerfile && echo "Dockerfile: OK"
          test -f bench/bench.py && echo "bench/bench.py: OK"

      - name: Python syntax check
        run: |
          python3 -c "import py_compile; py_compile.compile('poseidon_py.py', doraise=True)"
          python3 -c "import py_compile; py_compile.compile('bench/bench.py', doraise=True)"
          echo "Python syntax: OK"
